<body>

  <div class="dir" id="windArrow">↑</div><div id="windTxt">--</div></div>

    <div style="display:flex;gap:6px;align-items:center"><button class="clubBtn" id="clubDown">−</button>

<div id="skipTip">点击任意处跳过 ▸</div>

<script>
"use strict";
/* ============ 随机数（固定种子 → 球场布局恒定） ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd = mulberry32(88217);

/* ============ 值噪声地形基函数 ============ */
const PERM = new Uint8Array(512);
{ const r = mulberry32(3141); const p = [...Array(256).keys()];
  for (let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  for (let i=0;i<512;i++) PERM[i]=p[i&255]; }
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const h=(X,Z)=>PERM[(PERM[(X&255)]+(Z&255))&511]/255;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return h(xi,zi)*(1-u)*(1-v)+h(xi+1,zi)*u*(1-v)+h(xi,zi+1)*(1-u)*v+h(xi+1,zi+1)*u*v;
}
function fbm(x,z){ return vnoise(x*0.004,z*0.004)*14 + vnoise(x*0.014,z*0.014)*4 + vnoise(x*0.05,z*0.05)*0.9 - 9.5; }

/* ============ 18 洞布局生成（环路：前9外环顺时针，后9内环继续） ============ */
const PARS = [4,4,5,3,4,4,3,5,4, 4,3,4,5,4,3,4,5,4];
const HOLE_NAMES = ["花丘","云杉","糖果溪","风车","蘑菇林","彩虹坡","小鸭池","松果","归营",
  "雾谷","野莓","石桥","长绒","蜜糖湾","风铃","落日台","回旋","王冠"];
function lenForPar(par){ return par===3 ? 150+rnd()*45 : par===4 ? 280+rnd()*100 : 430+rnd()*80; }
const V2=(x,z)=>({x,z});
function distPtSeg(p,a,b){
  const dx=b.x-a.x,dz=b.z-a.z,L2=dx*dx+dz*dz;
  let t=L2?((p.x-a.x)*dx+(p.z-a.z)*dz)/L2:0; t=Math.max(0,Math.min(1,t));
  const px=a.x+dx*t,pz=a.z+dz*t; return Math.hypot(p.x-px,p.z-pz);
}
function distToPath(x,z,path){ let d=1e9; for(let i=0;i<path.length-1;i++) d=Math.min(d,distPtSeg({x,z},path[i],path[i+1])); return d; }

const holes = [];
{
  let pos = V2(0,0), dir = 0;                       // 从会所出发朝东
  const turnPer = Math.PI*2/18;
  const placedPts = [];
  for (let i=0;i<18;i++){
    const par = PARS[i], len = lenForPar(par);
    let path=null, ok=false;
    for (let attempt=0; attempt<12 && !ok; attempt++){
      const bend = rnd()<0.45 ? (rnd()<0.5?-1:1)*(0.25+rnd()*0.35) : 0;   // 狗腿 ±14°~34°
      const L1 = bend ? len*(0.5+rnd()*0.12) : len;
      const elbow = V2(pos.x+Math.cos(dir)*L1, pos.z+Math.sin(dir)*L1);
      const dir2 = dir + bend;
      const end = bend ? V2(elbow.x+Math.cos(dir2)*(len-L1), elbow.z+Math.sin(dir2)*(len-L1)) : elbow;
      path = bend ? [pos,elbow,end] : [pos,end];
      // 只避让非相邻洞（链式布局新 tee 必然贴着上一洞 green，相邻洞豁免）
      ok = placedPts.every(q=>q.hole>=i-1 || distToPath(q.x,q.z,path)>48)
        && Math.abs(end.x)<1000 && Math.abs(end.z)<1000;
      if (!ok) dir += 0.07;
    }
    const green = path[path.length-1], greenR = 10.5+rnd()*4.5;
    const h = { idx:i, par, name:HOLE_NAMES[i], len: Math.round(len),
      tee: V2(pos.x,pos.z), green, greenR, path, bunkers: [], waters: [] };
    // 落点区沙坑（球道侧翼）
    const nFB = par===3 ? 0 : (rnd()<0.6?1:2);
    for (let b=0;b<nFB;b++){
      const t=0.55+rnd()*0.2, seg=path.length-2, a=path[Math.floor(seg*t)], c=path[Math.floor(seg*t)+1];
      const bx=a.x+(c.x-a.x)*(seg*t%1), bz=a.z+(c.z-a.z)*(seg*t%1);
      const dd=Math.atan2(c.z-a.z,c.x-a.x), off=(rnd()<0.5?-1:1)*(9+rnd()*7);
      h.bunkers.push({x:bx-Math.sin(dd)*off, z:bz+Math.cos(dd)*off, rx:4+rnd()*4, rz:2.5+rnd()*2, rot:rnd()*3});
    }
    // 果岭沙坑
    const nGB = 1+Math.floor(rnd()*2);
    for (let b=0;b<nGB;b++){
      const ga=rnd()*Math.PI*2, gd=greenR+2.5+rnd()*3;
      h.bunkers.push({x:green.x+Math.cos(ga)*gd, z:green.z+Math.sin(ga)*gd, rx:3+rnd()*2.5, rz:2+rnd()*1.5, rot:rnd()*3});
    }
    // 水障碍：Par3 洞前塘，或球道后段横溪（避开满挥落点区，首洞教学不放主水）
    const mid = path[Math.floor(path.length/2)];
    if (i>0 && (par===3 || rnd()<0.35)){
      const t=par===3?0.8:0.55+rnd()*0.23, a=path[0], c=path[path.length-1];
      h.waters.push({x:a.x+(c.x-a.x)*t, z:a.z+(c.z-a.z)*t, r:12+rnd()*8});
    } else if (i>0 && rnd()<0.3){
      h.waters.push({x:mid.x+(rnd()-0.5)*30, z:mid.z+(rnd()-0.5)*30, r:9+rnd()*8});
    }
    holes.push(h);
    placedPts.push({...h.tee,hole:i},{...h.green,hole:i},...path.map(p=>({...p,hole:i})));
    const dd = Math.atan2(green.z-pos.z, green.x-pos.x);
    pos = V2(green.x+Math.cos(dd+Math.PI/2)*(rnd()<0.5?-24:24)+Math.cos(dd)*8,
             green.z+Math.sin(dd+Math.PI/2)*(rnd()<0.5?-24:24)+Math.sin(dd)*8);
    dir = dd + turnPer + (rnd()-0.5)*0.14;
  }
}

/* ============ 地形高度 & 地表材质（解析函数，物理与渲染共用） ============ */
function baseHeight(x,z){ return fbm(x,z); }
/* 走廊修正后的高度 */
function groundHeight(x,z){
  let h = baseHeight(x,z);
  for (const hdef of holes){
    // AABB 粗筛
    let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;
    for (const p of hdef.path){ mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mnz=Math.min(mnz,p.z);mxz=Math.max(mxz,p.z);}
    if (x<mnx-60||x>mxx+60||z<mnz-60||z>mxz+60) continue;
    const d = distToPath(x,z,hdef.path);
    const dG = Math.hypot(x-hdef.green.x, z-hdef.green.z);
    const dT = Math.hypot(x-hdef.tee.x, z-hdef.tee.z);
    if (dG < hdef.greenR+10){
      const hg = baseHeight(hdef.green.x,hdef.green.z)+0.35;
      const w = dG<hdef.greenR ? 1 : 1-(dG-hdef.greenR)/10;
      h = h*(1-w) + hg*w;
    } else if (dT < 7){
      const ht = baseHeight(hdef.tee.x,hdef.tee.z)+0.25;
      const w = dT<4 ? 1 : 1-(dT-4)/3;
      h = h*(1-w) + ht*w;
    } else if (d < 34){
      // 球道纵向：向 tee→green 的线性插值高度靠拢
      const total = hdef.len;
      let s=0, acc=0, best=1e9;
      for (let i=0;i<hdef.path.length-1;i++){
        const a=hdef.path[i],b=hdef.path[i+1],segL=Math.hypot(b.x-a.x,b.z-a.z);
        const dd=distPtSeg({x,z},a,b); if(dd<best){best=dd;
          const L2=(b.x-a.x)**2+(b.z-a.z)**2; let t=L2?((x-a.x)*(b.x-a.x)+(z-a.z)*(b.z-a.z))/L2:0;
          s = acc + Math.max(0,Math.min(1,t))*segL; }
        acc+=segL;
      }
      const hf = baseHeight(hdef.tee.x,hdef.tee.z)*(1-s/total) + baseHeight(hdef.green.x,hdef.green.z)*(s/total);
      const w = d<13 ? 0.85 : d<24 ? 0.85*(1-(d-13)/11) : 0.35*(1-(d-24)/10);
      h = h*(1-Math.max(0,w)) + hf*Math.max(0,w);
    }
  }
  // 水塘下压 & 沙坑凹陷
  for (const hdef of holes){
    for (const w of hdef.waters){
      const d = Math.hypot(x-w.x,z-w.z);
      if (d < w.r+8){
        const t = d<w.r ? 1 : 1-(d-w.r)/8;
        h = Math.min(h, (h*(1-t)) + (w.level-2.2)*t);
      }
    }
    for (const b of hdef.bunkers){
      const dx=x-b.x,dz=z-b.z, cr=Math.cos(b.rot),sr=Math.sin(b.rot);
      const ex=(dx*cr+dz*sr)/b.rx, ez=(-dx*sr+dz*cr)/b.rz, e=ex*ex+ez*ez;
      if (e<1.4) h -= 0.55*Math.max(0,1-e/1.4);
    }
  }
  return h;
}
/* 水面高度表（生成时定） */
for (const h of holes) for (const w of h.waters) w.level = baseHeight(w.x,w.z)+0.15;
/* 环路幅员中心（俯瞰相机用） */
const courseCenter = (()=>{
  let xs=[],zs=[];
  for (const h of holes){ xs.push(h.tee.x,h.green.x); zs.push(h.tee.z,h.green.z); }
  return { x:(Math.min(...xs)+Math.max(...xs))/2, z:(Math.min(...zs)+Math.max(...zs))/2 };
})();

function surfaceAt(x,z){
  for (const hdef of holes){
    for (const w of hdef.waters) if (Math.hypot(x-w.x,z-w.z)<w.r && groundHeight(x,z)<w.level) return "water";
  }
  for (const hdef of holes){
    for (const b of hdef.bunkers){
      const dx=x-b.x,dz=z-b.z, cr=Math.cos(b.rot),sr=Math.sin(b.rot);
      const ex=(dx*cr+dz*sr)/b.rx, ez=(-dx*sr+dz*cr)/b.rz;
      if (ex*ex+ez*ez<1) return "sand";
    }
  }
  for (const hdef of holes){
    if (Math.hypot(x-hdef.green.x,z-hdef.green.z)<hdef.greenR) return "green";
    if (Math.hypot(x-hdef.tee.x,z-hdef.tee.z)<4) return "tee";
    if (distToPath(x,z,hdef.path)<13) return "fairway";
  }
  return "rough";
}

/* ============ Three.js 场景 ============ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById("c").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd2ecf8, 1100, 3600);      // 远景空气透视（远一点，避免俯瞰发白）
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 8000);
addEventListener("resize", ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* 天空穹顶：三段渐变（地平线奶白 → 青空 → 深天蓝），动画电影式高饱和 */
function buildSky(){
  const geo=new THREE.SphereGeometry(4200,32,18);
  const mat=new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{ t:{value:0} },
    vertexShader:`varying vec3 vP; void main(){ vP=position;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vP;
      void main(){
        float h=clamp(normalize(vP).y*0.5+0.5,0.0,1.0);
        vec3 low=vec3(0.98,0.99,0.94);      // 地平线暖白
        vec3 mid=vec3(0.55,0.85,0.99);      // 近地青空
        vec3 top=vec3(0.24,0.55,0.94);      // 天顶蓝
        vec3 c = h<0.5 ? mix(low,mid,h/0.5) : mix(mid,top,(h-0.5)/0.5);
        gl_FragColor=vec4(c,1.0);
      }`});
  scene.add(new THREE.Mesh(geo,mat));
}
buildSky();

/* 光源：暖阳主光 + 天空半球环境 + 冷色轮廓补光（三层打光，圆润立体感） */
const sun = new THREE.DirectionalLight(0xfff1cf, 1.15);
sun.position.set(-500, 700, 350);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-320; sun.shadow.camera.right=320;
sun.shadow.camera.top=320; sun.shadow.camera.bottom=-320;
sun.shadow.camera.far=2200; sun.shadow.bias=-0.0006; sun.shadow.radius=3;
const rim = new THREE.DirectionalLight(0x9fdcff, 0.35);
rim.position.set(600, 380, -520);
scene.add(sun, rim, new THREE.HemisphereLight(0xdcf4ff, 0x5fa858, 0.62));

/* 太阳光斑（贴在天空穹顶上，带柔光晕） */
function buildSunDisc(){
  const cv=document.createElement("canvas"); cv.width=cv.height=256;
  const g=cv.getContext("2d");
  const rad=g.createRadialGradient(128,128,10,128,128,128);

function buildTerrain(){
  const geo = new THREE.PlaneGeometry(WORLD,WORLD,SEG,SEG);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const C = { fair:[0.34,0.72,0.38], fair2:[0.24,0.60,0.30], rough:[0.20,0.52,0.26],
    green:[0.43,0.80,0.38], tee:[0.39,0.75,0.36], sand:[0.96,0.92,0.74], bed:[0.10,0.32,0.30], wild:[0.16,0.46,0.23] };
  for (let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h = groundHeight(x,z);
    pos.setY(i,h);
    const s = surfaceAt(x,z);
    let c = C.wild;
    if (s==="fairway"){
      // 沿洞方向剪草条纹
      let c2=C.fair;
      for (const hd of holes){
        const d=distToPath(x,z,hd.path);
        if (d<13){
          let acc=0,s2=0,best=1e9;
          for(let j=0;j<hd.path.length-1;j++){const a=hd.path[j],b=hd.path[j+1],segL=Math.hypot(b.x-a.x,b.z-a.z);
            const dd=distPtSeg({x,z},a,b); if(dd<best){best=dd;const L2=(b.x-a.x)**2+(b.z-a.z)**2;let t=L2?((x-a.x)*(b.x-a.x)+(z-a.z)*(b.z-a.z))/L2:0;s2=acc+Math.max(0,Math.min(1,t))*segL;}acc+=segL;}
          c2 = (Math.floor(s2/13)%2) ? C.fair : C.fair2;
          break;
        }
      }
      c = c2;
    }
    else if (s==="green") c=C.green;
    else if (s==="tee") c=C.tee;
    else if (s==="sand") c=C.sand;
    else if (s==="water") c=C.bed;
    else {
      const n=vnoise(x*0.05,z*0.05);
      c = n>0.62 ? C.wild : (n>0.4 ? C.rough : C.wild);
      if (distToAnyPath(x,z)<26) c=C.rough;
    }
    const shade = 0.97+vnoise(x*0.08,z*0.08)*0.06;
    colors[i*3]=Math.min(1,c[0]*shade); colors[i*3+1]=Math.min(1,c[1]*shade); colors[i*3+2]=Math.min(1,c[2]*shade);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors,3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors:true, map:grassTexture() });
  terrain = new THREE.Mesh(geo,mat);

}

function buildTrees(){
  const N1=380,N2=360;
  const rTrunk=new THREE.CylinderGeometry(0.28,0.42,2.4,8);
  const rLeaf=new THREE.IcosahedronGeometry(2.35,2);
  const rLeafTop=new THREE.IcosahedronGeometry(1.30,2);
  const rPine=new THREE.ConeGeometry(1.85,4.2,11);
  const rPineTop=new THREE.ConeGeometry(1.20,2.7,11);
  const matTrunk=new THREE.MeshLambertMaterial({color:0x9a6440});
  const matLeaf=new THREE.MeshLambertMaterial({color:0xffffff});
  const matPine=new THREE.MeshLambertMaterial({color:0xffffff});
  const pines=new THREE.InstancedMesh(rPine,matPine,N1), pineTops=new THREE.InstancedMesh(rPineTop,matPine,N1);
  const leafs=new THREE.InstancedMesh(rLeaf,matLeaf,N2), leafTops=new THREE.InstancedMesh(rLeafTop,matLeaf,N2);
  const trunks=new THREE.InstancedMesh(rTrunk,matTrunk,N1+N2);
  pines.castShadow=leafs.castShadow=pineTops.castShadow=leafTops.castShadow=true;
  trunks.castShadow=true;
  const M=new THREE.Matrix4(), Q=new THREE.Quaternion(), S=new THREE.Vector3(), P=new THREE.Vector3();
  const LEAF_C=[0x48c463,0x5ed473,0x35b25f,0x6cd77a,0x41bf8a];
  const PINE_C=[0x1f9257,0x2aa763,0x167f4e,0x33b06a];
  const col=new THREE.Color();
  let i1=0,i2=0,it=0,guard=0;
  while (i1+i2 < N1+N2 && guard++<60000){
    const x=(rnd()-0.5)*2200, z=(rnd()-0.5)*2200;
    if (distToAnyPath(x,z)<26) continue;
    let near=false;
    for (const h of holes){ if (Math.hypot(x-h.green.x,z-h.green.z)<h.greenR+16 || Math.hypot(x-h.tee.x,z-h.tee.z)<10){near=true;break;}
      for (const w of h.waters) if (Math.hypot(x-w.x,z-w.z)<w.r+6){near=true;break;} }
    if (near) continue;
    const sc=0.75+rnd()*1.15, y=groundHeight(x,z);
    const isPine = (i1<N1) && (i2>=N2 || rnd()<0.5);
    const rot=rnd()*6.28;
    Q.setFromAxisAngle(new THREE.Vector3(0,1,0),rot);
    P.set(x,y,z); S.set(sc*1.06,sc,sc*1.06);
    M.compose(P.clone().setY(y+1.2*sc),Q,S); trunks.setMatrixAt(it++,M);
    col.setHex(isPine?PINE_C[i1%PINE_C.length]:LEAF_C[i2%LEAF_C.length]);
    if (isPine){
      M.compose(P.clone().setY(y+3.9*sc),Q,S); pines.setMatrixAt(i1,M); pines.setColorAt(i1,col);
      M.compose(P.clone().setY(y+6.3*sc),Q,S); pineTops.setMatrixAt(i1,M); pineTops.setColorAt(i1,col.clone().offsetHSL(0,0,0.03));
      i1++;
    } else {
      M.compose(P.clone().setY(y+3.6*sc),Q,S); leafs.setMatrixAt(i2,M); leafs.setColorAt(i2,col);
      M.compose(P.clone().setY(y+5.4*sc),Q,S); leafTops.setMatrixAt(i2,M); leafTops.setColorAt(i2,col.clone().offsetHSL(0,0,0.05));
      i2++;
    }
  }
  pines.count=i1; pineTops.count=i1; leafs.count=i2; leafTops.count=i2; trunks.count=it;
  scene.add(pines,pineTops,leafs,leafTops,trunks);
}

let actx=null, master=null, muted=false;
function audio(){
  if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=1.2;master.connect(actx.destination);}

function tone(t,f0,f1,dur,type,vol){
  const a=audio(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function nz(t,dur,vol,hp){
  const a=audio(),len=Math.max(1,Math.floor(a.sampleRate*dur)),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource();src.buffer=buf;
  const f=a.createBiquadFilter();f.type=hp?"highpass":"lowpass";f.frequency.value=hp||2200;
  const g=a.createGain();g.gain.value=vol;
  src.connect(f);f.connect(g);g.connect(master);src.start(t);
}

/* ============ 球杆 & 物理 ============ */
const CLUBS=[
  {n:"Driver",loft:10.5,v:74},{n:"3 Wood",loft:15,v:69},{n:"5 Iron",loft:26,v:59},
  {n:"7 Iron",loft:33,v:53},{n:"9 Iron",loft:41,v:45},{n:"PW",loft:47,v:39},
  {n:"SW",loft:56,v:31},{n:"Putter",loft:2,v:9}
];
const G=9.8, K=0.0014, KL=0.0008, DRAG_LOFT_SCALE=2.0;  // 标定值：Driver carry≈215m
function simulate(ballStart, clubIdx, power, aimDeg){
  const club=CLUBS[clubIdx];
  const az=aimDeg*Math.PI/180;
  const pts=[{x:ballStart.x,y:ballStart.y,z:ballStart.z}];
  let res={pts, holed:false, water:false, surface:"", carry:0, end:null};
  if (club.n==="Putter"){
    // 推杆：纯滚动。初速按"当前表面 μ"标定到目标距离 +0.8m 过洞余量；
    // power 是精细微调（0.2~1.0 → ×0.76~1.0），不是砍距离的开关
    const dist0=Math.hypot(cur.pin.x-ballStart.x,cur.pin.z-ballStart.z);
    const surf0=surfaceAt(ballStart.x,ballStart.z);
    const mu0=surf0==="green"?0.09:surf0==="fairway"||surf0==="tee"?0.13:0.22;
    let v=Math.sqrt(2*mu0*G*(dist0+0.8))*(0.7+0.3*power);
    let px=ballStart.x,pz=ballStart.z,dx=Math.sin(az),dz=-Math.cos(az);
    // 注意方位：azim 0 = 朝 -Z 之外的定义见 aimDirTo
    const dir3=aimDirTo(aimDeg,1);
    dx=dir3.x;dz=dir3.z;
    let speed=v;
    for(let i=0;i<1200&&speed>0.02;i++){
      const dt=0.016;
      px+=dx*speed*dt;pz+=dz*speed*dt;
      const gy=groundHeight(px,pz);
      pts.push({x:px,y:gy+0.22,z:pz});
      const s=surfaceAt(px,pz);
      const mu=s==="green"?0.09:s==="fairway"?0.13:s==="sand"?2.5:0.28;
      speed-=mu*G*dt;
      if(s==="water"){res.water=true;break;}
      const dp=Math.hypot(px-cur.pin.x,pz-cur.pin.z);
      if(dp<0.25&&speed<3){res.holed=true;break;}
      if(dp<0.06){res.holed=true;break;}
      if(speed<0.02)res.surface=s;
    }
    res.end=pts[pts.length-1];return res;
  }
  const v0=club.v*power, el=club.loft*Math.PI/180;
  const dir3=aimDirTo(aimDeg,1);
  let p={...ballStart}, v={x:dir3.x*v0*Math.cos(el), y:v0*Math.sin(el), z:dir3.z*v0*Math.cos(el)};
  let phase="fly", spin=1, apexY=0;
  for(let i=0;i<4000;i++){
    const dt=0.016;
    if(phase==="fly"){
      const sp=Math.hypot(v.x,v.y,v.z);
      const kd=K*(1+(club.loft-10)/25*DRAG_LOFT_SCALE); // 高 loft 后旋大，drag 压弹道
      const lift=KL*(v.x*v.x+v.z*v.z);                  // Magnus 升力（后旋托球）
      v.x+=(-kd*sp*v.x + windVec.x*0.028*sp*0.02)*dt;
      v.y+=(-G - kd*sp*v.y + lift)*dt;
      v.z+=(-kd*sp*v.z + windVec.z*0.028*sp*0.02)*dt;
      p.x+=v.x*dt;p.y+=v.y*dt;p.z+=v.z*dt;
      apexY=Math.max(apexY,p.y);
      const gy=groundHeight(p.x,p.z);
      pts.push({...p});
      if(p.y<=gy+0.22){
        p.y=gy+0.22;
        const s=surfaceAt(p.x,p.z);
        res.carry=Math.hypot(p.x-ballStart.x,p.z-ballStart.z);
        if(s==="water"){res.water=true;break;}
        const rest=s==="green"?0.18:0.28;
        if(Math.abs(v.y)>3){v.y=-v.y*rest;v.x*=0.68;v.z*=0.68;}
        else{phase="roll";}
      }
    }else{
      const sp=Math.hypot(v.x,v.z);
      if(sp<0.05){res.surface=surfaceAt(p.x,p.z);break;}
      const s=surfaceAt(p.x,p.z);
      const mu=s==="green"?0.09:s==="fairway"?0.13:s==="sand"?2.2:s==="tee"?0.13:0.28;
      const nx=v.x/sp,nz=v.z/sp;
      // 坡度
      const e=0.6,hx=(groundHeight(p.x+e,p.z)-groundHeight(p.x-e,p.z))/(2*e),
            hz=(groundHeight(p.x,p.z+e)-groundHeight(p.x,p.z-e))/(2*e);
      v.x+=(-mu*G*nx - G*hx*0.9)*dt; v.z+=(-mu*G*nz - G*hz*0.9)*dt;
      if(s==="sand"){v.x*=0.86;v.z*=0.86;}
      p.x+=v.x*dt;p.z+=v.z*dt;p.y=groundHeight(p.x,p.z)+0.22;
      pts.push({...p});
      const dp=Math.hypot(p.x-cur.pin.x,p.z-cur.pin.z);
      if(dp<0.25&&sp<3){res.holed=true;break;}
      if(dp<0.055){res.holed=true;break;}
      if(s==="water"){res.water=true;break;}
      res.surface=s;
    }
  }
  res.end=pts[pts.length-1];
  return res;
}
/* 方位角定义：0° 面向当前洞目标方向，右偏为正 */
let aimBase=0;                                    // 当前目标方位（弧度，three 坐标）
function aimDirTo(deg,len){
  const a=aimBase+deg*Math.PI/180;
  return {x:Math.cos(a)*len, z:Math.sin(a)*len};
}
function dirBetween(a,b){return Math.atan2(b.z-a.z,b.x-a.x);}

/* ============ 游戏状态 ============ */
let cur=null, holeIdx=0, strokes=0, scores=[], ballPos=null, lastShotFrom=null;
let state="boot";                                 // brief | aim | flight | score
const M2Y=m=>m*1.0936;
function setHole(i){
  holeIdx=i; cur=holes[i]; strokes=0;
  cur.pin={x:cur.green.x,y:groundHeight(cur.green.x,cur.green.z),z:cur.green.z};
  ballPos={x:cur.tee.x,y:groundHeight(cur.tee.x,cur.tee.z)+0.22,z:cur.tee.z};
  ball.position.set(ballPos.x,ballPos.y,ballPos.z);
  aimBase=dirBetween(cur.tee,cur.pin);
  trailReset();
  document.getElementById("holeName").textContent=`HOLE ${i+1} · ${cur.name}`;
  document.getElementById("hcPar").textContent=cur.par;
  document.getElementById("hcLen").textContent=Math.round(M2Y(cur.len))+" yds";
  updateHUD(); updateAimLine();
}
function distToPin(){return Math.hypot(ballPos.x-cur.pin.x,ballPos.z-cur.pin.z);}
function updateHUD(){
  document.getElementById("hcLeft").textContent=Math.round(M2Y(distToPin()))+" yds";
  document.getElementById("hcStrokes").textContent=strokes;
  const tot=scores.reduce((a,s)=>a+s.strokes,0);
  const parSoFar=holes.slice(0,scores.length).reduce((a,h)=>a+h.par,0);
  const diff=tot-parSoFar;
  document.getElementById("hcTotal").textContent=scores.length?`${tot} (${diff>0?"+":""}${diff})`:"—";
  // 球童
  const d=distToPin();
  let ci=CLUBS.findIndex(c=>estCarry(c)>=d);
  if(ci<0)ci=0;
  if(d<40&&surfaceAt(ballPos.x,ballPos.z)!=="rough")ci=CLUBS.length-1;
  clubIdx=ci;
  document.getElementById("clubV").textContent=CLUBS[ci].n;
  // 推荐杆同步推荐力量（推杆用满档微调，远杆留余量）
  const pw = CLUBS[ci].n==="Putter" ? 90 : 95;
  document.getElementById("power").value=pw;
  document.getElementById("powerV").textContent=pw+"%";
  const windTo=windDir;
  // 球位→pin 连线上的水警提示
  let waterWarn="";
  for (const hd of holes) for (const w of hd.waters){
    const dx=cur.pin.x-ballPos.x, dz=cur.pin.z-ballPos.z, L=Math.hypot(dx,dz);
    if (L<1) continue;
    const t=((w.x-ballPos.x)*dx+(w.z-ballPos.z)*dz)/(L*L);
    if (t<=0||t>=1) continue;
    const perp=Math.abs((w.x-ballPos.x)*dz-(w.z-ballPos.z)*dx)/L;
    if (perp < w.r+6){
      const dw=t*L-w.r;
      if (dw>0){ waterWarn=`<br>⚠ 前方 <b>${Math.round(M2Y(dw))} yds</b> 有水`; break; }
    }
  }
  document.getElementById("caddyTxt").innerHTML=
    `剩 <b>${Math.round(M2Y(d))} yds</b> · 建议 <b>${CLUBS[ci].n}</b>`+
    (windSpd>=4?`<br>风 ${windSpd} m/s，注意修正`:"")+waterWarn;
  syncShadow();
}
function calibCarry(c){ // 用真实弹道引擎标定 carry（平地、无进洞判定）
  if(c.n==="Putter")return 8;
  const el=c.loft*Math.PI/180, v0=c.v*0.95;
  const kd=K*(1+(c.loft-10)/25*DRAG_LOFT_SCALE);
  let p={x:0,y:1,z:0}, v={x:v0*Math.cos(el), y:v0*Math.sin(el), z:0};
  for(let i=0;i<3000;i++){
    const dt=0.016, sp=Math.hypot(v.x,v.y,v.z);
    const lift=KL*v.x*v.x;
    v.x+=-kd*sp*v.x*dt; v.y+=(-G-kd*sp*v.y+lift)*dt; v.z+=-kd*sp*v.z*dt;
    p.x+=v.x*dt; p.y+=v.y*dt;
    if(p.y<=0)break;
  }
  return p.x;
}
CLUBS.forEach(c=>c.carryEst=calibCarry(c));
function estCarry(c){ return c.carryEst; }
let clubIdx=0;
function updateAimLine(){
  const deg=+document.getElementById("aim").value;
  const d=aimDirTo(deg,60);
  const a=aimGeo.attributes.position.array;
  a[0]=ballPos.x;a[1]=ballPos.y+0.1;a[2]=ballPos.z;
  a[3]=ballPos.x+d.x;a[4]=groundHeight(ballPos.x+d.x,ballPos.z+d.z)+0.3;a[5]=ballPos.z+d.z;
  aimGeo.attributes.position.needsUpdate=true;
  aimLine.computeLineDistances();
}
/* 相机 */
let camMode="aim", camT=0;
function aimCam(){
  const back=aimDirTo(+document.getElementById("aim").value,-5.5);
  const tx=ballPos.x+back.x, tz=ballPos.z+back.z;
  const ty=groundHeight(tx,tz)+2.3;
  camera.position.set(tx,ty,tz);
  const fwd=aimDirTo(+document.getElementById("aim").value,120);
  camera.lookAt(ballPos.x+fwd.x,ballPos.y+9,ballPos.z+fwd.z);   // 望向前方 120m 上空，尽收球道
}
function briefCam(t){ // 洞介绍：从果岭上空拉回发球台
  const p=Math.min(1,t/3);
  const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  const g=cur.pin, te=ballPos;
  const x=g.x+(te.x-g.x)*e, z=g.z+(te.z-g.z)*e;
  const y=groundHeight(x,z)+28*(1-e)+3.2*e;
  camera.position.set(x,y,z);
  camera.lookAt(te.x,groundHeight(te.x,te.z)+1,te.z);
}
let flyCamPos=null;
function flyCam(){
  const d=aimDirTo(+document.getElementById("aim").value,-16);
  const want={x:ball.position.x+d.x*0.7, z:ball.position.z+d.z*0.7};
  want.y=Math.max(ball.position.y+7, groundHeight(want.x,want.z)+6);
  if(!flyCamPos)flyCamPos=want;
  flyCamPos.x+=(want.x-flyCamPos.x)*0.06;
  flyCamPos.y+=(want.y-flyCamPos.y)*0.06;
  flyCamPos.z+=(want.z-flyCamPos.z)*0.06;
  camera.position.set(flyCamPos.x,flyCamPos.y,flyCamPos.z);
  camera.lookAt(ball.position.x,ball.position.y,ball.position.z);
}
function overviewCam(){
  // 环路实际幅员中心（生成后计算）
  camera.position.set(courseCenter.x,1500,courseCenter.z+750);
  camera.lookAt(courseCenter.x,0,courseCenter.z);
}
let overview=false;
document.getElementById("overviewBtn").onclick=()=>{
  overview=!overview;
  document.getElementById("overviewBtn").textContent=overview?"返回球位":"俯瞰全场";
  if(!overview&&state==="aim")aimCam();
};
/* 大字 */
const bigEl=document.getElementById("big");
let bigTimer=null;
function showBig(label,num,unit,sub,gold,holdMs){
  document.getElementById("bigLabel").textContent=label;
  document.getElementById("bigNum").textContent=num;
  document.getElementById("bigUnit").textContent=unit;
  document.getElementById("bigSub").textContent=sub||"";
  bigEl.classList.toggle("gold",!!gold);
  bigEl.classList.add("show");
  clearTimeout(bigTimer);
  if(holdMs)bigTimer=setTimeout(()=>bigEl.classList.remove("show"),holdMs);
}
/* 挥杆 */
document.getElementById("swingBtn").onclick=doSwing;
addEventListener("keydown",e=>{if(e.code==="Space"&&state==="aim"){e.preventDefault();doSwing();}});
function doSwing(){
  if(state!=="aim")return;
  const power=+document.getElementById("power").value/100;
  const aimDeg=+document.getElementById("aim").value;
  fire(ballPos,clubIdx,power,aimDeg);
}
let flight=null;
function fire(from,ci,power,aimDeg){
  state="flight"; flyCamPos=null; camMode="flight";
  document.getElementById("swingBtn").disabled=true;
  trailReset(); sfxShot();
  lastShotFrom={...from};
  const r=simulate(from,ci,power,aimDeg);
  flight={r,i:0,dt:1/60};
}
function finishFlight(){
  const r=flight.r; flight=null;
  strokes++;
  const shotYds=Math.round(M2Y(Math.hypot(r.end.x-lastShotFrom.x,r.end.z-lastShotFrom.z)));
  ballPos={x:r.end.x,y:r.end.y,z:r.end.z};
  if(r.water){
    sfxWaterS();
    showBig("WATER","+1","PEN","罚 1 杆 · 回到原位",false,2600);
    strokes++; // 罚杆
    setTimeout(()=>{
      ballPos={...lastShotFrom};
      ball.position.set(ballPos.x,ballPos.y,ballPos.z);
      aimBase=dirBetween(ballPos,cur.pin);
      state="aim";camMode="aim";trailReset();updateHUD();updateAimLine();
      document.getElementById("swingBtn").disabled=false;
    },2700);
    return;
  }
  sfxLand();
  if(r.holed){
    sfxHole();
    const diff=strokes-cur.par;
    const label=strokes===1?"HOLE IN ONE!":diff<=-3?"ALBATROSS":diff===-2?"EAGLE":diff===-1?"BIRDIE":diff===0?"PAR":diff===1?"BOGEY":diff===2?"DOUBLE":"+"+diff;
    showBig(label,strokes,strokes>1?"STROKES":"STROKE",`PAR ${cur.par} · 第 ${holeIdx+1} 洞完成`,true,2800);
    scores.push({strokes,par:cur.par});
    renderScorecard();
    setTimeout(()=>{
      bigEl.classList.remove("show");
      if(holeIdx<17){setHole(holeIdx+1);startBrief();}
      else{showBig("ROUND COMPLETE",scores.reduce((a,s)=>a+s.strokes,0),"TOTAL",scoreDiffTxt(),true,0);
        document.getElementById("scorecard").classList.add("open");state="done";}
    },2900);
    return;
  }
  // 未进洞：下一杆
  aimBase=dirBetween(ballPos,cur.pin);
  const left=Math.round(M2Y(distToPin()));
  showBig("SHOT",shotYds,"YDS","",false,1800);
  setTimeout(()=>{
    showBig("TO PIN",left,"YDS",surfaceCn(surfaceAt(ballPos.x,ballPos.z)),false,1800);
  },1900);
  setTimeout(()=>{
    state="aim";camMode="aim";trailReset();updateHUD();updateAimLine();
    document.getElementById("swingBtn").disabled=false;
  },3800);
}
function scoreDiffTxt(){
  const tot=scores.reduce((a,s)=>a+s.strokes,0),par=holes.reduce((a,h)=>a+h.par,0),d=tot-par;
  return d===0?"EVEN PAR":(d>0?"+"+d:""+d);
}
function surfaceCn(s){return {green:"果岭 ON GREEN",fairway:"球道 FAIRWAY",rough:"长草 ROUGH",sand:"沙坑 BUNKER",tee:"发球台",water:""}[s]||s;}
/* brief 运镜 */
let briefT=0;
function startBrief(){
  state="brief";camMode="brief";briefT=0;
  document.getElementById("skipTip").style.display="block";
}
function skipBrief(){
  if(state!=="brief")return;
  document.getElementById("skipTip").style.display="none";
  state="aim";camMode="aim";
}
addEventListener("pointerdown",skipBrief);
addEventListener("keydown",skipBrief);
/* 记分卡 */
function renderScorecard(){
  let html="<tr><th>洞</th>"+holes.map((h,i)=>`<th class="${i===holeIdx?'cur':''}">${i+1}</th>`).join("")+"<th>总</th></tr>";
  html+="<tr><td>Par</td>"+holes.map(h=>`<td>${h.par}</td>`).join("")+`<td>${holes.reduce((a,h)=>a+h.par,0)}</td></tr>`;
  html+="<tr><td>杆</td>"+holes.map((h,i)=>{
    const s=scores[i]; return `<td class="${i===holeIdx?'cur':''}">${s?s.strokes:"—"}</td>`;
  }).join("")+`<td>${scores.reduce((a,s)=>a+s.strokes,0)||"—"}</td></tr>`;
  document.getElementById("scoreTbl").innerHTML=html;
}
document.getElementById("scoreBtn").onclick=()=>document.getElementById("scorecard").classList.toggle("open");
/* 控件 */
document.getElementById("aim").oninput=e=>{document.getElementById("aimV").textContent=(+e.target.value).toFixed(1)+"°";updateAimLine();if(state==="aim"&&camMode==="aim")aimCam();};
document.getElementById("power").oninput=e=>document.getElementById("powerV").textContent=e.target.value+"%";
document.getElementById("clubDown").onclick=()=>{clubIdx=Math.max(0,clubIdx-1);document.getElementById("clubV").textContent=CLUBS[clubIdx].n;};
document.getElementById("clubUp").onclick=()=>{clubIdx=Math.min(CLUBS.length-1,clubIdx+1);document.getElementById("clubV").textContent=CLUBS[clubIdx].n;};
/* 阴影相机跟随当前洞 */
function syncShadow(){
  const cx=(ballPos.x+cur.pin.x)/2, cz=(ballPos.z+cur.pin.z)/2;
  sun.position.set(cx-500,700,cz+350);
  sun.target.position.set(cx,0,cz);
  sun.target.updateMatrixWorld();
}
/* ============ 主循环 ============ */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,clock.getDelta());
  if(overview){overviewCam();}
  else if(camMode==="brief"){briefT+=dt;briefCam(briefT);if(briefT>3.2)skipBrief();}
  else if(camMode==="aim"){aimCam();}
  else if(camMode==="flight"){
    if(flight){
      // 落地后的慢速滚动按 3.5 倍速回放（纯表现层，不改物理轨迹），
      // 否则一次开球的地面滚动要等 20 秒以上
      const gy0=groundHeight(ball.position.x,ball.position.z);
      const rolling=ball.position.y<=gy0+0.45;
      flight.dt+=dt*(rolling?3.5:1);
      const step=Math.floor(flight.dt/(1/60));
      for(let k=0;k<step&&flight.i<flight.r.pts.length;k++){
        const p=flight.r.pts[flight.i++];
        ball.position.set(p.x,p.y,p.z);
        trailPush(p);
      }
      flight.dt-=step/60;
      if(flight.i>=flight.r.pts.length)finishFlight();
    }
    flyCam();
  }
  // 旗子轻摆
  const t=performance.now()/1000;
  pins.forEach((f,i)=>{f.rotation.y=Math.sin(t*1.3+i)*0.3;});
  // 云漂移（慢速横移，越界回卷）
  for (const c of cloudGroups){
    c.position.x+=c.userData.v*dt;
    if(c.position.x>1750)c.position.x=-1750;
  }
  // 水面轻微起伏 + 洞杯光环呼吸
  for (let i=0;i<waterMeshes.length;i++)
    waterMeshes[i].position.y=waterMeshes[i].userData.baseY+Math.sin(t*1.7+i*0.7)*0.05;
  for (let i=0;i<cupRings.length;i++)
    cupRings[i].material.opacity=0.36+0.2*Math.sin(t*2.1+i);
  renderer.render(scene,camera);
}
/* ============ 启动 ============ */
const loadBar=document.getElementById("loadBar"),loadTip=document.getElementById("loadTip");
function boot(){
  loadTip.textContent="生成地形与球道…";loadBar.style.width="15%";
  setTimeout(()=>{
    buildTerrain();loadBar.style.width="55%";loadTip.textContent="种植树木与障碍…";
    setTimeout(()=>{
      buildWaters();buildTrees();buildMarkers();buildClubhouse();buildClouds();
      loadBar.style.width="90%";loadTip.textContent="就绪";
      setTimeout(()=>{
        document.getElementById("loading").style.display="none";
        setHole(0);renderScorecard();startBrief();loop();
      },150);
    },30);
  },30);
}
boot();
/* ============ 探针（测试用） ============ */
window.__info=()=>({state,hole:holeIdx+1,strokes,distToPin:distToPin(),holes:holes.length,par:holes.reduce((a,h)=>a+h.par,0)});
window.__forceShot=(o={})=>{
  if(state==="brief")skipBrief();
  if(state!=="aim")return false;
  const power=o.power??0.95, aimDeg=o.aim??0;
  if(o.club!=null)clubIdx=o.club;
  fire(ballPos,clubIdx,power,aimDeg); return true;
};
window.__skip=skipBrief;
window.__setHole=i=>{setHole(i);startBrief();};
window.__estCarry=()=>CLUBS.map(c=>({n:c.n,carry:Math.round(estCarry(c))}));
window.__debugShot=(o={})=>{ // 诊断：同步跑一遍模拟并返回摘要
  const power=o.power??0.95, ci=o.club??clubIdx, aim=o.aim??0;
  const from=o.from??ballPos;
  const r=simulate(from,ci,power,aim);
  return {club:CLUBS[ci].n, n:r.pts.length, carry:Math.round(r.carry), water:r.water,
    holed:r.holed, surface:r.surface,
    end:{x:+r.end.x.toFixed(1),y:+r.end.y.toFixed(1),z:+r.end.z.toFixed(1)},
    start:{x:+from.x.toFixed(1),y:+from.y.toFixed(1),z:+from.z.toFixed(1)},
    apex:+Math.max(...r.pts.slice(0,200).map(p=>p.y)).toFixed(1)};
};
window.__groundHeight=groundHeight;
window.__surfaceAt=surfaceAt;
</script>
